android {
    namespace 'com.dtac.fx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dtac.fx'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
